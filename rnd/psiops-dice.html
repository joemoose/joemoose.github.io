<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSIOPS Dice Roller</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120f;
    --bg-raised: #1c1915;
    --bg-well: #100e0b;
    --amber: #ffb000;
    --amber-dim: #8a6100;
    --text: #e8dfc8;
    --text-dim: #7a7266;
    --border: #332c22;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(255,176,0,0.05), transparent 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: 48px 16px 80px;
  }

  main{ width:100%; max-width: 720px; }

  header{
    text-align:center;
    margin-bottom: 36px;
  }

  .stamp-label{
    font-family: 'Special Elite', monospace;
    letter-spacing: 3px;
    font-size: 12px;
    color: var(--amber-dim);
    text-transform: uppercase;
  }

  h1{
    font-family: 'Special Elite', monospace;
    font-size: 32px;
    margin: 6px 0 8px;
    color: var(--amber);
    letter-spacing: 1px;
  }

  .subtitle{
    font-size: 14px;
    color: var(--text-dim);
  }

  .cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
  }

  .card{
    flex:1;
    min-width: 260px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 22px;
    display:flex;
    flex-direction:column;
  }

  .card h2{
    font-family: 'Special Elite', monospace;
    font-size: 18px;
    color: var(--text);
    letter-spacing: 1px;
    margin: 0 0 10px;
  }

  .card p{
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin: 0 0 18px;
  }

  .spacer{ flex:1; }

  input[type="text"]{
    width:100%;
    background: var(--bg-well);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 6px;
    text-align:center;
    padding: 11px 10px;
    border-radius: 3px;
    margin-bottom: 14px;
  }
  input::placeholder{ color: var(--text-dim); letter-spacing: 6px; }
  input:focus, button:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  .btn{
    width:100%;
    padding: 13px;
    border-radius: 3px;
    font-family: 'Special Elite', monospace;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn:active{ transform: translateY(1px); }

  .btn-primary{
    background: var(--amber);
    color: #1a1400;
    border: none;
  }

  .btn-secondary{
    background: var(--bg-well);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-secondary:not(:disabled):hover{ color: var(--amber); border-color: var(--amber-dim); }
  .btn-secondary:disabled{ opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<main>

  <header>
    <div class="stamp-label">// transmission log</div>
    <h1>PSIOPS Dice Roller</h1>
    <div class="subtitle">Create a room and roll together</div>
  </header>

  <div class="cards">

    <div class="card">
      <h2>Create Room</h2>
      <p>Start a new session and invite others with the room code.</p>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="create-btn">Create Room</button>
    </div>

    <div class="card">
      <h2>Join Room</h2>
      <p>Type a 6-digit room code to join an existing room.</p>
      <div class="spacer"></div>
      <input type="text" id="room-code" placeholder="XXXXXX" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="6-digit room code">
      <button class="btn btn-secondary" id="join-btn" disabled>Join Room</button>
    </div>

  </div>

</main>

<script>
  // The roller page lives in the same directory, so a relative link keeps
  // this working wherever the pair is deployed.
  const ROLLER_PAGE = 'psiops-dice-roller.html';

  function goToRoom(code){
    location.href = ROLLER_PAGE + '?room=' + code;
  }

  document.getElementById('create-btn').addEventListener('click', () => {
    // 6 random digits, leading zeros allowed
    const code = String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
    goToRoom(code);
  });

  const codeInput = document.getElementById('room-code');
  const joinBtn = document.getElementById('join-btn');

  codeInput.addEventListener('input', () => {
    // Digits only, max six
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    joinBtn.disabled = codeInput.value.length !== 6;
  });

  codeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !joinBtn.disabled) goToRoom(codeInput.value);
  });

  joinBtn.addEventListener('click', () => {
    if (codeInput.value.length === 6) goToRoom(codeInput.value);
  });
</script>
</body>
</html>
