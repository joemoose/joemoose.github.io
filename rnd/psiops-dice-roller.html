<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSIOPS Roller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #14120f;
    --bg-raised: #1c1915;
    --bg-well: #100e0b;
    --amber: #ffb000;
    --amber-dim: #8a6100;
    --text: #e8dfc8;
    --text-dim: #7a7266;
    --miss: #b6544f;
    --partial: #c99a3a;
    --hit: #5c9e6b;
    --border: #332c22;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(255,176,0,0.05), transparent 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 24px 16px 80px;
  }

  main{ width:100%; max-width: 640px; }

  header{
    border-bottom: 1px dashed var(--border);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }

  .stamp-label{
    font-family: 'Special Elite', monospace;
    letter-spacing: 3px;
    font-size: 12px;
    color: var(--amber-dim);
    text-transform: uppercase;
  }

  h1{
    font-family: 'Special Elite', monospace;
    font-size: 22px;
    margin: 4px 0 2px;
    color: var(--amber);
    letter-spacing: 1px;
  }

  .room-tag{
    font-size: 13px;
    color: var(--text-dim);
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-dim); }
  .status.live .dot{ background: var(--hit); box-shadow: 0 0 6px var(--hit); }
  .status.live{ color: var(--hit); }

  .panel{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 20px;
  }

  label{
    display:block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  input[type="text"], select, input[type="number"]{
    width:100%;
    background: var(--bg-well);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 3px;
  }
  input:focus, select:focus, button:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  .row{ display:flex; gap:12px; margin-bottom: 14px; flex-wrap: wrap; }
  .row > div{ flex:1; min-width: 140px; }

  .mode-toggle{ display:flex; gap:8px; }
  .mode-toggle button{
    flex:1;
    padding: 9px 6px;
    background: var(--bg-well);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    border-radius: 3px;
    cursor: pointer;
  }
  .mode-toggle button.active{
    color: var(--amber);
    border-color: var(--amber-dim);
    background: rgba(255,176,0,0.08);
  }

  .roll-btn{
    width:100%;
    padding: 14px;
    background: var(--amber);
    color: #1a1400;
    border: none;
    border-radius: 3px;
    font-family: 'Special Elite', monospace;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 4px;
  }
  .roll-btn:active{ transform: translateY(1px); }
  .roll-btn:disabled{ opacity: 0.5; cursor: default; }

  .log-header{
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .log-header .right{ display:flex; align-items:center; gap:10px; }

  .clear-btn{
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
  }
  .clear-btn:hover{ color: var(--miss); border-color: var(--miss); }
  .clear-btn:disabled{ opacity: 0.4; cursor: default; }

  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .entry:last-child{ border-bottom:none; }

  .entry .who{
    flex: 0 0 96px;
    font-size: 13px;
    color: var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .entry .time{ font-size: 10px; color: var(--text-dim); display:block; }

  .dice-readout{
    flex: 1;
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 13px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .die{
    display:inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
  }
  .die.dropped{
    text-decoration: line-through;
    color: var(--text-dim);
    border-color: var(--border);
    opacity: 0.6;
  }
  .mod{ color: var(--text-dim); }
  .total{ color: var(--amber); font-weight:700; }

  .badge{
    flex: 0 0 auto;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 8px;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    text-transform: uppercase;
    transform: rotate(-2deg);
  }
  .badge.miss{ color: var(--miss); }
  .badge.partial{ color: var(--partial); }
  .badge.hit{ color: var(--hit); }

  .empty{
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px 0;
    text-align:center;
  }

  .config-warning{
    background: rgba(182,84,79,0.12);
    border: 1px solid var(--miss);
    color: var(--miss);
    padding: 12px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; }
  }

  #dice-overlay{
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #dice-overlay.rolling{ opacity: 1; }
  #dice-overlay canvas{
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div id="dice-overlay"></div>
<main>

  <header>
    <div class="stamp-label">// transmission log</div>
    <h1 id="room-title">PSIOPS Roller</h1>
    <div class="room-tag">room: <span id="room-name"></span></div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">connecting</span></div>
  </header>

  <div id="config-warning" class="config-warning" style="display:none;">
    Supabase credentials aren't set. Open this file and fill in SUPABASE_URL and
    SUPABASE_ANON_KEY near the top of the script block. See SETUP.md for the full walkthrough.
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <label for="player-name">Callsign</label>
        <input type="text" id="player-name" placeholder="Your name" maxlength="24">
      </div>
      <div>
        <label for="modifier">Modifier</label>
        <input type="number" id="modifier" value="0" min="-3" max="5" step="1">
      </div>
    </div>

    <label>Roll type</label>
    <div class="mode-toggle" id="mode-toggle">
      <button data-mode="disadvantage">Disadvantage</button>
      <button data-mode="normal" class="active">Normal</button>
      <button data-mode="advantage">Advantage</button>
    </div>

    <button class="roll-btn" id="roll-btn" style="margin-top:16px;">Roll</button>
  </div>

  <div class="log-header">
    <span>Recent rolls</span>
    <span class="right">
      <span id="roll-count"></span>
      <button class="clear-btn" id="clear-btn" title="Clear all rolls in this room, for everyone">Clear</button>
    </span>
  </div>
  <div id="log"></div>
  <div class="empty" id="empty-state">No rolls yet in this room.</div>

</main>

<script type="module">
  // ---------------------------------------------------------------
  // 1. Create a free project at https://supabase.com
  // 2. Run the SQL from SETUP.md in the Supabase SQL editor
  // 3. Settings -> API: copy the Project URL and publishable key below
  // ---------------------------------------------------------------
  const SUPABASE_URL = 'https://krlvnqewikgcgpdmwvyu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_2Ob8SVggXrxPGL8oUN99HQ_NcnqhK9v';

  const ROOM = new URLSearchParams(location.search).get('room') || 'lobby';
  document.getElementById('room-name').textContent = ROOM;
  document.title = 'PSIOPS Roller — ' + ROOM;

  const configured = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  if (!configured) {
    document.getElementById('config-warning').style.display = 'block';
    document.getElementById('roll-btn').disabled = true;
    document.getElementById('clear-btn').disabled = true;
  }

  const PLAYER_KEY = 'pbta-roller-player-name';
  const nameInput = document.getElementById('player-name');
  nameInput.value = localStorage.getItem(PLAYER_KEY) || '';
  nameInput.addEventListener('change', () => {
    localStorage.setItem(PLAYER_KEY, nameInput.value.trim());
  });

  let mode = 'normal';
  document.getElementById('mode-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    mode = btn.dataset.mode;
    document.querySelectorAll('#mode-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  });

  // 3D dice are local-only visual flavor. The roll values are generated
  // first with the same RNG as always, logged to Supabase as the result,
  // and THEN the dice are animated with a predetermined outcome — the
  // dice-box-threejs library tumbles them so they land exactly on the
  // values we already decided. The animation is therefore guaranteed to
  // match the log; it cannot disagree by construction. If the library
  // fails to load, rolls simply happen without animation.
  let diceBox = null;
  let diceBoxReady = false;
  let overlayTimer = null;
  const overlayEl = document.getElementById('dice-overlay');

  (async () => {
    try {
      const mod = await import(
        'https://cdn.jsdelivr.net/npm/@3d-dice/dice-box-threejs@0.0.12/+esm'
      );
      const DiceBox = mod.default;
      diceBox = new DiceBox('#dice-overlay', {
        sounds: false,
        shadows: true,
        light_intensity: 0.8,
        gravity_multiplier: 400,
        // Dice size — raise or lower to taste (default 100)
        baseScale: 90,
        strength: 1.5,
        theme_customColorset: {
          background: '#ffb000',
          foreground: '#1a1400',
          texture: 'none',
          material: 'plastic'
        }
      });
      if (typeof diceBox.initialize === 'function') {
        await diceBox.initialize();
      }
      diceBoxReady = true;
    } catch (err) {
      console.warn('3D dice unavailable, rolling without animation:', err);
      diceBoxReady = false;
    }
  })();

  function rollDie(){ return 1 + Math.floor(Math.random() * 6); }

  // Turns a plain array of already-rolled d6 values into the kept/dropped
  // result for the current mode. Used for both the 3D physics results and
  // the plain-random fallback, so the game logic is identical either way.
  function resolveRoll(dice, mode){
    if (mode === 'normal') {
      return { dice, dropped: null, kept: dice };
    }
    const sorted = [...dice].sort((a,b) => a-b);
    if (mode === 'advantage') {
      return { dice, dropped: sorted[0], kept: [sorted[1], sorted[2]] };
    }
    return { dice, dropped: sorted[2], kept: [sorted[0], sorted[1]] };
  }

  function computeBand(total){
    if (total <= 6) return 'miss';
    if (total <= 9) return 'partial';
    return 'hit';
  }

  function bandLabel(band){
    return { miss: 'Fail', partial: 'Partial', hit: 'Success' }[band];
  }

  function formatTime(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  const logEl = document.getElementById('log');
  const emptyEl = document.getElementById('empty-state');
  const countEl = document.getElementById('roll-count');
  let rollCount = 0;

  function renderEntry(row, prepend){
    emptyEl.style.display = 'none';
    rollCount++;
    countEl.textContent = rollCount;

    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.dataset.id = row.id;

    // Only one die was actually dropped, so strike through exactly one —
    // the first die matching the dropped value — even when several dice
    // share that value (e.g. rolling 6,1,1 with advantage drops one 1).
    let droppedShown = false;
    const diceHtml = row.dice.map(v => {
      const isDropped = row.dropped !== null && v === row.dropped && !droppedShown;
      if (isDropped) droppedShown = true;
      return `<span class="die${isDropped ? ' dropped' : ''}">${v}</span>`;
    }).join('');

    const modSign = row.modifier >= 0 ? '+' + row.modifier : row.modifier;

    entry.innerHTML = `
      <div class="who">${escapeHtml(row.player)}<span class="time">${formatTime(row.created_at)}</span></div>
      <div class="dice-readout">${diceHtml}<span class="mod">${modSign}</span><span>=</span><span class="total">${row.total}</span></div>
      <div class="badge ${row.band}">${bandLabel(row.band)}</div>
    `;

    if (prepend) {
      logEl.prepend(entry);
    } else {
      logEl.appendChild(entry);
    }
  }

  function removeEntry(id){
    const el = logEl.querySelector(`[data-id="${id}"]`);
    if (!el) return;
    el.remove();
    rollCount = Math.max(0, rollCount - 1);
    countEl.textContent = rollCount || '';
    if (rollCount === 0) emptyEl.style.display = 'block';
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  let sb;
  if (configured) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    init();
  }

  async function init(){
    const { data, error } = await sb
      .from('rolls')
      .select('*')
      .eq('room', ROOM)
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) {
      console.error(error);
      document.getElementById('status-text').textContent = 'error loading history';
    } else {
      data.forEach(row => renderEntry(row, false));
    }

    sb.channel('room-' + ROOM)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'rolls', filter: `room=eq.${ROOM}` },
        payload => renderEntry(payload.new, true)
      )
      .on('postgres_changes',
        // No room filter here: Postgres only includes the primary key in the
        // "old row" payload for deletes by default, so filtering on `room`
        // wouldn't match. Matching by id client-side instead is a no-op for
        // rows from other rooms, so this is safe either way.
        { event: 'DELETE', schema: 'public', table: 'rolls' },
        payload => removeEntry(payload.old.id)
      )
      .subscribe((status) => {
        const el = document.getElementById('status');
        const text = document.getElementById('status-text');
        if (status === 'SUBSCRIBED') {
          el.classList.add('live');
          text.textContent = 'live';
        }
      });
  }

  document.getElementById('roll-btn').addEventListener('click', async () => {
    const player = nameInput.value.trim() || 'Operative';
    localStorage.setItem(PLAYER_KEY, player);
    const modifier = parseInt(document.getElementById('modifier').value, 10) || 0;
    const qty = mode === 'normal' ? 2 : 3;

    // The values are decided here, before any animation. These are what
    // gets logged; the 3D dice are then told to land on exactly these.
    const diceValues = Array.from({ length: qty }, rollDie);

    if (diceBoxReady) {
      try {
        clearTimeout(overlayTimer);
        overlayEl.classList.add('rolling');
        await diceBox.roll(qty + 'd6@' + diceValues.join(','));
        overlayTimer = setTimeout(() => overlayEl.classList.remove('rolling'), 2500);
      } catch (err) {
        console.warn('Dice animation failed (roll still counts):', err);
        overlayEl.classList.remove('rolling');
      }
    }

    const { dice, dropped, kept } = resolveRoll(diceValues, mode);
    const total = kept[0] + kept[1] + modifier;
    const band = computeBand(total);

    const { error } = await sb.from('rolls').insert({
      room: ROOM,
      player,
      dice,
      dropped,
      modifier,
      total,
      mode,
      band
    });

    if (error) console.error(error);
  });

  document.getElementById('clear-btn').addEventListener('click', async () => {
    const ok = confirm('Clear all rolls in room "' + ROOM + '" for everyone? This can\'t be undone.');
    if (!ok) return;

    const { error } = await sb.from('rolls').delete().eq('room', ROOM);
    if (error) {
      console.error(error);
      alert('Could not clear the log: ' + error.message);
      return;
    }

    // Optimistic local clear — the DELETE events above will also arrive and
    // no-op harmlessly against an already-empty log.
    logEl.innerHTML = '';
    rollCount = 0;
    countEl.textContent = '';
    emptyEl.style.display = 'block';
  });
</script>
</body>
</html>
